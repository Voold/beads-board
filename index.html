    }
    function render() {
      const project=state.projects.find(item => item.slug === state.project), groups=boardGroups(), board=$('board');
      const scrollLeft=board.scrollLeft, scrollTop=board.scrollTop, columnScrolls=new Map([...board.querySelectorAll('[data-column]')].map(column => [column.dataset.column,column.querySelector('.column-body').scrollTop]));
      const graphProject=state.projects.find(item => item.slug===state.graphProject) || state.projects[0];
      $('title').textContent=state.view==='graph' ? graphProject?.slug || 'Граф задач' : project ? project.slug : 'Все проекты';
      $('summary').textContent=state.view==='graph' ? graphProject?.root || 'Проекты Beads' : project ? project.root : state.view==='tree' ? `${state.projects.length} проектов из ~/beads · вложенность и блокирующие зависимости` : `${state.projects.length} проектов из ~/beads · задачи по дате последнего обновления`;
      renderProjects();
      document.querySelectorAll('[data-view]').forEach(button => {const active=button.dataset.view===state.view;button.classList.toggle('active',active);if (active) button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});
      $('layout').classList.toggle('graph-mode',state.view==='graph');
      board.classList.toggle('tree-view',state.view==='tree');
      board.classList.toggle('graph-view',state.view==='graph');
      if (state.view==='graph') {renderGraph(board);return;}
      graphRuntime=null;
      if (state.view==='tree') {
        board.innerHTML=renderTree();
        board.scrollLeft=0;
        board.scrollTop=scrollTop;
        board.querySelectorAll('[data-key]').forEach(button => button.addEventListener('click', () => openDrawer(button.dataset.key)));
        board.querySelectorAll('[data-toggle]').forEach(button => button.addEventListener('click', () => {const key=button.dataset.toggle;if (state.treeCollapsed.has(key)) state.treeCollapsed.delete(key);else state.treeCollapsed.add(key);render();}));
        return;
      }
      board.innerHTML=columns.map(column => renderColumn(column,groups)).join('');
      board.scrollLeft=scrollLeft;
      board.querySelectorAll('[data-column]').forEach(column => {column.querySelector('.column-body').scrollTop=columnScrolls.get(column.dataset.column) || 0;});
      board.querySelectorAll('[data-key]').forEach(button => button.addEventListener('click', () => openDrawer(button.dataset.key)));
      board.querySelectorAll('[data-more]').forEach(button => button.addEventListener('click', () => {state.columnLimits[button.dataset.more]+=200;render();}));
    }
    function promptFor(kind,issue) {
      const task=`${issue.id} «${issue.title}»`, project=issue.project.slug;
      if (kind==='inspect') return `Разбери задачу Beads ${task} в проекте ${project}: проверь актуальные описание, критерии и зависимости, затем скажи следующий шаг.`;
      if (kind==='claim') return `Возьми в работу задачу Beads ${task} в проекте ${project} и приступай. Сначала проверь актуальное состояние и критерии готовности.`;
      if (kind==='continue') return `Продолжи работу по задаче Beads ${task} в проекте ${project}. Сначала проверь уже сделанное, затем выполни оставшуюся работу.`;
      return `Закрой задачу Beads ${task} в проекте ${project}. Перед закрытием проверь критерии готовности и зафиксируй результат.`;
    }
    function openDrawer(key) {
      const issue=state.byKey.get(key);if (!issue) return;
      state.selected=key;
      const field=(name,value) => value ? `<div class="field"><div class="field-label">${name}</div><div class="field-value">${escapeHtml(value)}</div></div>` : '';
      const warning=issue.project.source==='live' ? '' : `<div class="source-warning">${issue.project.source==='demo' ? 'Это демоданные. ' : issue.project.source==='snapshot' ? `Показан снимок от ${dateTime(issue.project.updated_at)}. ` : 'Данные проекта недоступны. '}${escapeHtml(issue.project.error || '')}</div>`;
      $('drawer').innerHTML=`<div class="drawer-top"><div class="drawer-id">${escapeHtml(issue.id)}</div><button class="close" id="close-drawer" type="button" aria-label="Закрыть подробности">×</button></div><h2>${escapeHtml(issue.title)}</h2><div class="chips"><span class="chip">${escapeHtml(statusNames[issue.status] || issue.status)}</span><span class="chip">P${escapeHtml(issue.priority)}</span><span class="chip ${issue.issue_type==='epic' ? 'type-epic' : ''}">${escapeHtml(typeNames[issue.issue_type] || issue.issue_type || 'Задача')}</span>${issue.assignee ? `<span class="chip">${escapeHtml(issue.assignee)}</span>` : ''}</div>${field('Описание',issue.description)}${field('Критерии готовности',issue.acceptance_criteria)}${field('Результат закрытия',issue.close_reason)}${field('Проект',issue.project.root)}<hr class="rule"><h3>Промпты</h3><p class="hint">Кнопка копирует текст в буфер. Beads здесь не меняется.</p><div class="actions"><button class="action primary" data-action="inspect" type="button">Разобрать</button>${issue.status==='closed' ? '' : `<button class="action" data-action="${issue.status==='open' ? 'claim' : 'continue'}" type="button">${issue.status==='open' ? 'Взять в работу' : 'Продолжить'}</button><button class="action" data-action="close" type="button">Закрыть</button>`}</div>${warning}`;
      $('close-drawer').addEventListener('click',closeDrawer);
      $('drawer').querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => copy(promptFor(button.dataset.action,issue))));
      $('backdrop').classList.add('show');$('drawer').classList.add('show');
    }
    function closeDrawer() {state.selected=null;$('backdrop').classList.remove('show');$('drawer').classList.remove('show');}
    function showToast(message) {const toast=$('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(() => toast.classList.remove('show'),2300);}
    async function copy(text) {
      try {
        let copied=false;
        if (navigator.clipboard && window.isSecureContext) {try {await navigator.clipboard.writeText(text);copied=true;} catch { /* Резервный способ для браузеров без доступа к Clipboard API. */ }}
        if (!copied) {const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();copied=document.execCommand('copy');area.remove();}
        showToast(copied ? 'Промпт скопирован' : 'Не удалось скопировать');
      } catch {showToast('Не удалось скопировать');}
    }
    function applyData(data) {
      state.projects=data.projects;
      state.issues=data.projects.flatMap(project => project.issues.map(issue => ({...issue,project})));
      state.byKey=new Map(state.issues.map(issue => [issueKey(issue),issue]));
      render();
      if (state.selected && state.byKey.has(state.selected)) openDrawer(state.selected);
      else if (state.selected) closeDrawer();
    }
    async function refresh() {
      if (state.loading) return;
      state.loading=true;$('refresh').disabled=true;$('sync').className='sync';$('sync').textContent='Обновляю…';
      try {
        const response=await fetch('/api/projects',{cache:'no-store'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data=await response.json();
        const snapshots=data.projects.filter(project => project.source==='snapshot').length, errors=data.projects.filter(project => project.source==='error').length;
        $('sync').textContent=errors ? `${errors} проектов недоступно · ${dateTime(data.fetched_at)}` : snapshots ? `${snapshots} из снимка · ${dateTime(data.fetched_at)}` : `Актуально · ${dateTime(data.fetched_at)}`;
        $('sync').className=errors ? 'sync error' : snapshots ? 'sync warning' : 'sync';
        applyData(data);
      } catch (error) {
        $('sync').className='sync error';$('sync').textContent=`Ошибка обновления: ${error.message}`;
        if (!state.projects.length) $('board').innerHTML='<div class="empty">Не удалось получить задачи. Запусти <code>python3 server.py</code> и открой адрес, который он покажет.</div>';
      } finally {state.loading=false;$('refresh').disabled=false;}
    }
    $('refresh').addEventListener('click',refresh);
    document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => {state.view=button.dataset.view;if (state.view==='graph' && !state.graphProject && state.project!=='all') state.graphProject=state.project;render();}));
    $('search').addEventListener('input',render);
    $('search').addEventListener('keydown',event => {if (event.key==='Enter' && state.view==='graph') graphFocusFirstMatch();});
    $('backdrop').addEventListener('click',closeDrawer);
    document.addEventListener('keydown',event => {if (event.key==='Escape') closeDrawer();});
    if (location.protocol==='file:') {
      try {
        const snapshot=JSON.parse($('snapshot-data').textContent);
        applyData(snapshot);
        $('sync').className='sync warning';
        $('sync').textContent=`Демоданные · живые задачи через start.command`;
        $('refresh').disabled=true;
        $('refresh').title='Для обновления запусти start.command';
      } catch {
        $('sync').className='sync error';
        $('sync').textContent='Демоданные недоступны · запусти start.command';
        $('board').innerHTML='<div class="empty">Для живых данных запусти <code>start.command</code>.</div>';
      }
    } else {
      refresh();
      setInterval(() => {if (document.visibilityState==='visible') refresh();},30000);
    }
  </script>
</body>
</html>
