<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Beads</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e2e5eb; background: #111318; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid #a2b9ed; outline-offset: 2px; }
    .top { height: 62px; display: flex; align-items: center; gap: 17px; padding: 0 22px; border-bottom: 1px solid #2a2e36; background: #171a20; }
    .logo { font-size: 19px; font-weight: 760; letter-spacing: -.6px; }
    .tag { color: #9299a7; font-size: 12px; }
    .top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .sync { color: #9aa2af; font-size: 12px; text-align: right; }
    .sync.warning { color: #d9b978; }
    .sync.error { color: #e4a1a1; }
    .refresh, .close, .action { border: 1px solid #3b414c; border-radius: 8px; background: #22262e; color: #d6dbe4; padding: 8px 11px; font-size: 12px; font-weight: 620; }
    .refresh:hover, .close:hover, .action:hover { background: #2b303a; border-color: #677b9e; }
    .refresh:disabled { opacity: .5; cursor: wait; }
    .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); height: calc(100vh - 62px); }
    .projects { overflow: auto; border-right: 1px solid #2a2e36; background: #171a20; padding: 22px 10px; }
    .eyebrow { padding: 0 11px 11px; color: #818b9b; text-transform: uppercase; letter-spacing: 1px; font-size: 10px; font-weight: 750; }
    .project { width: 100%; display: flex; gap: 8px; align-items: center; border: 0; border-radius: 8px; background: transparent; color: #a9b0bd; padding: 10px 11px; text-align: left; font-size: 12px; }
    .project:hover { background: #242932; }
    .project.active { background: #2a3446; color: #c6d7ff; font-weight: 680; }
    .project-name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .project-count { color: #7f8998; font-variant-numeric: tabular-nums; }
    .main { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    .toolbar { padding: 23px 26px 17px; display: flex; align-items: end; gap: 22px; border-bottom: 1px solid #2a2e36; }
    h1 { margin: 0 0 3px; font-size: 23px; letter-spacing: -.5px; }
    .summary { color: #8c95a4; font-size: 12px; margin: 0; max-width: 440px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .controls { margin-left: auto; display: flex; gap: 15px; align-items: center; }
    .search { border: 1px solid #3a404b; border-radius: 8px; background: #1b1f26; color: #e2e5eb; padding: 9px 11px; width: min(260px, 22vw); min-width: 160px; font-size: 12px; }
    .search::placeholder { color: #777f8e; }
    .legend { display: flex; gap: 13px; flex-wrap: wrap; margin-top: 10px; color: #929baa; font-size: 11px; }
    .legend span { white-space: nowrap; }
    .legend .epic-mark { color: #c6a6f0; }
    .legend .parent-mark { color: #9cbbe5; }
    .legend .task-mark { color: #a8b0bd; }
    .board { display: flex; gap: 13px; overflow: auto; padding: 20px 22px 30px; flex: 1; align-items: flex-start; }
    .column { flex: 1 0 245px; min-width: 245px; max-height: 100%; display: flex; flex-direction: column; border: 1px solid #30343d; border-radius: 10px; background: #191c22; }
    .column-head { display: flex; align-items: center; gap: 8px; padding: 15px 15px 13px; border-bottom: 1px solid #30343d; font-size: 13px; font-weight: 710; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #8d9fc5; }
    .column.open .status-dot { background: #94aee8; }
    .column.in_progress .status-dot { background: #e1bd7d; }
    .column.paused .status-dot { background: #d99696; }
    .column.closed .status-dot { background: #8fbea1; }
    .column-count { margin-left: auto; color: #848e9c; font-size: 11px; font-weight: 550; }
    .column-body { overflow: auto; padding: 0 9px 12px; }
    .day { margin-top: 14px; }
    .day-head { display: flex; align-items: center; gap: 9px; padding: 0 5px 9px; color: #949eac; font-size: 11px; font-weight: 680; }
    .day-head:after { content: ""; height: 1px; flex: 1; background: #353a43; }
    .epic, .task { border: 1px solid #343942; border-radius: 8px; background: #22262e; margin-bottom: 8px; }
    .epic.is-epic { border-left: 3px solid #ae8bd7; background: #27242f; }
    .epic.is-parent { border-left: 3px solid #7395c5; }
    .epic-head { border: 0; display: block; width: 100%; background: transparent; color: inherit; padding: 12px; text-align: left; }
    .epic-head:hover, .task:hover { background: #2a2f39; }
    .type-badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 5px; padding: 4px 6px; background: #353c48; color: #b9c4d3; font-size: 10px; font-weight: 760; line-height: 1; }
    .type-badge.epic { background: #463753; border: 0; color: #dfc3ff; margin: 0; }
    .type-badge.parent { background: #2d4058; color: #bdd7fb; }
    .type-badge.subtask { background: #303946; color: #aebdd1; }
    .type-badge.closed { background: #284238; color: #a2d9ba; }
    .epic-kicker { display: flex; align-items: center; gap: 7px; color: #a9bce2; font-size: 10px; font-weight: 720; margin-bottom: 7px; }
    .parent-status { color: #949cab; font-weight: 520; }
    .epic-title { color: #e0e4ec; font-size: 12px; font-weight: 680; line-height: 1.38; overflow-wrap: anywhere; }
    .epic-tasks { padding: 0 7px 7px; }
    .subday { color: #858f9e; font-size: 10px; font-weight: 650; padding: 7px 5px 5px; }
    .epic-foot { color: #8791a1; font-size: 10px; padding: 1px 12px 10px; }
    .epic-tasks .task { background: #1b1f26; margin-bottom: 5px; }
    .task { display: block; width: 100%; padding: 11px 12px; color: inherit; text-align: left; }
    .task.standalone { border-left: 3px solid #727d8d; }
    .task.subtask { border-left: 2px solid #51647e; }
    .task.is-closed { border-color: #365044; }
    .task-line { display: flex; gap: 7px; align-items: center; color: #a9bce2; font-size: 10px; font-weight: 700; margin-bottom: 6px; }
    .task-project { color: #8b95a3; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }
    .task-time { margin-left: auto; color: #808a98; font-weight: 500; }
    .task-title { font-size: 12px; font-weight: 580; line-height: 1.4; overflow-wrap: anywhere; }
    .issue-meta { color: #8994a3; font-size: 10px; margin-top: 7px; }
    .empty { padding: 23px 12px; color: #8993a2; font-size: 12px; line-height: 1.5; }
    .more { width: 100%; border: 1px solid #3c4552; border-radius: 7px; background: #252b34; color: #afc2df; padding: 10px; font-size: 11px; font-weight: 650; margin-top: 8px; }
    .more:hover { background: #303947; }
    .backdrop { position: fixed; inset: 0; background: #07090ca8; display: none; z-index: 10; }
    .backdrop.show { display: block; }
    .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(440px, 100vw); overflow: auto; background: #1b1f26; border-left: 1px solid #3b414c; padding: 23px 25px; box-shadow: -12px 0 45px #0006; z-index: 11; display: none; }
    .drawer.show { display: block; }
    .drawer-top { display: flex; align-items: center; gap: 10px; }
    .drawer-id { color: #acc2f0; font-size: 12px; font-weight: 740; }
    .close { margin-left: auto; padding: 5px 9px; font-size: 18px; line-height: 1; }
    h2 { font-size: 22px; line-height: 1.3; letter-spacing: -.4px; margin: 19px 0 16px; overflow-wrap: anywhere; }
    .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 27px; }
    .chip { background: #303641; border-radius: 6px; padding: 5px 8px; color: #b7c0ce; font-size: 11px; }
    .chip.type-epic { background: #463753; color: #dfc3ff; }
    .field { margin-bottom: 22px; }
    .field-label { color: #8b96a5; font-size: 11px; font-weight: 700; margin-bottom: 8px; }
    .field-value { color: #c6ccd7; font-size: 12px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    .rule { border: 0; border-top: 1px solid #373d47; margin: 27px 0; }
    h3 { margin: 0 0 5px; font-size: 14px; }
    .hint { color: #929baa; font-size: 11px; line-height: 1.5; margin: 0 0 15px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .action.primary { background: #3b537c; border-color: #5874a5; color: #eef3ff; }
    .action.primary:hover { background: #4b6591; }
    .source-warning { color: #e3c58a; border: 1px solid #6b5838; border-radius: 8px; background: #30291d; padding: 10px; font-size: 11px; line-height: 1.5; margin-top: 16px; overflow-wrap: anywhere; }
    .toast { position: fixed; right: 20px; bottom: 20px; padding: 10px 14px; border-radius: 8px; color: #fff; background: #415b86; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
    .toast.show { opacity: 1; }
    @media (max-width: 760px) { .top { padding: 0 14px; gap: 8px; } .tag { display: none; } .sync { max-width: 145px; } .layout { display: block; height: auto; } .projects { display: flex; padding: 7px; overflow-x: auto; border-right: 0; border-bottom: 1px solid #2a2e36; } .projects .eyebrow { display: none; } .project { min-width: 145px; width: auto; } .main { min-height: calc(100vh - 110px); } .toolbar { display: block; padding: 18px 16px 14px; } .controls { margin: 15px 0 0; justify-content: space-between; } .search { width: 55vw; } .board { padding: 14px; } .column { flex: 0 0 290px; min-width: 290px; } }
  </style>
</head>
<body>
  <header class="top"><div class="logo">Beads</div><div class="tag">Локальная доска задач</div><div class="top-right"><div class="sync" id="sync">Загружаю…</div><button class="refresh" id="refresh" type="button">Обновить</button></div></header>
  <div class="layout">
    <aside class="projects" id="projects" aria-label="Проекты"></aside>
    <main class="main"><div class="toolbar"><div><h1 id="title">Все проекты</h1><p class="summary" id="summary">Загружаю задачи</p><div class="legend"><span class="epic-mark">◆ Эпик</span><span class="parent-mark">▣ Родительская задача</span><span class="task-mark">□ Задача · ↳ Подзадача</span></div></div><div class="controls"><input class="search" id="search" type="search" placeholder="Поиск по задачам" aria-label="Поиск по задачам"></div></div><div class="board" id="board"><div class="empty">Читаю проекты Beads…</div></div></main>
  </div>
  <div class="backdrop" id="backdrop"></div><aside class="drawer" id="drawer" aria-label="Подробности задачи"></aside><div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script id="snapshot-data" type="application/json">{"fetched_at":"2026-10-14T12:00:00Z","projects":[{"slug":"demo","root":"Демо проект","prefix":"DEMO","source":"demo","updated_at":"2026-10-14T12:00:00Z","error":"Это вымышленные задачи. Для своих задач запусти start.command.","issues":[{"id":"DEMO-1","title":"Запустить проект","description":"Пример эпика с подзадачами.","acceptance_criteria":"Открыть локальную доску.","status":"in_progress","priority":2,"issue_type":"epic","assignee":null,"updated_at":"2026-10-14T12:00:00Z","closed_at":null,"close_reason":null},{"id":"DEMO-1.1","title":"Подготовить окружение","description":"Проверить Python 3 и Beads CLI.","acceptance_criteria":null,"status":"closed","priority":2,"issue_type":"task","assignee":null,"updated_at":"2026-10-13T10:00:00Z","closed_at":"2026-10-13T10:00:00Z","close_reason":"Окружение готово."},{"id":"DEMO-1.2","title":"Открыть доску","description":"Запустить start.command или python3 server.py.","acceptance_criteria":null,"status":"in_progress","priority":2,"issue_type":"task","assignee":null,"updated_at":"2026-10-14T11:00:00Z","closed_at":null,"close_reason":null},{"id":"DEMO-2","title":"Проверить команды","description":"Кнопки копируют промпты и не изменяют Beads.","acceptance_criteria":null,"status":"open","priority":2,"issue_type":"task","assignee":null,"updated_at":"2026-10-12T09:00:00Z","closed_at":null,"close_reason":null},{"id":"DEMO-3","title":"Изучить закрытые задачи","description":"Пример завершённой задачи.","acceptance_criteria":null,"status":"closed","priority":3,"issue_type":"task","assignee":null,"updated_at":"2026-10-11T18:00:00Z","closed_at":"2026-10-11T18:00:00Z","close_reason":"Пример результата."}]}]}</script>
  <script>
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
    const dateTime = value => value ? new Date(value).toLocaleString('ru-RU', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';
    const statusNames = {open:'Открыта',in_progress:'В работе',blocked:'Заблокирована',deferred:'Отложена',closed:'Закрыта'};
    const typeNames = {epic:'Эпик',feature:'Фича',bug:'Баг',task:'Задача',decision:'Решение'};
    const columns = [{key:'open',title:'Открытые'},{key:'in_progress',title:'В работе'},{key:'paused',title:'Пауза'},{key:'closed',title:'Закрытые'}];
    const state = {projects:[],issues:[],byKey:new Map(),project:'all',selected:null,loading:false,columnLimits:{open:200,in_progress:200,paused:200,closed:200}};
    const issueKey = issue => `${issue.project.slug}:${issue.id}`;
    const rootId = id => id.split('.')[0];
    const localDay = value => {const d=new Date(value);return Number.isNaN(d.getTime()) ? 'unknown' : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
    function dayLabel(key) {
      if (key === 'unknown') return 'Без даты';
      const today=localDay(new Date()), yesterday=localDay(new Date(Date.now()-86400000));
      if (key === today) return 'Сегодня';
      if (key === yesterday) return 'Вчера';
      return new Date(`${key}T12:00:00`).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
    }
    function boardGroups() {
      const query=$('search').value.trim().toLocaleLowerCase('ru-RU');
      const roots=new Map();
      for (const issue of state.issues) {
        if (state.project !== 'all' && issue.project.slug !== state.project) continue;
        const key=`${issue.project.slug}:${rootId(issue.id)}`;
        if (!roots.has(key)) roots.set(key,[]);
        roots.get(key).push(issue);
      }
      const groups=[];
      for (const [key,members] of roots) {
        const active=members.filter(issue => issue.status !== 'closed');
        const root=state.byKey.get(key), available=members;
        const matches=issue => [issue.id,issue.title,issue.description,issue.project.slug].some(value => String(value || '').toLocaleLowerCase('ru-RU').includes(query));
        if (query && !members.some(matches)) continue;
        const visible=query && root && !matches(root) ? available.filter(matches) : available;
        if (!visible.length) continue;
        const statusMembers=active.length ? active : members;
        const column=statusMembers.some(issue => issue.status === 'in_progress') ? 'in_progress' : statusMembers.some(issue => issue.status === 'open') ? 'open' : active.length ? 'paused' : 'closed';
        const updated=visible.reduce((latest,issue) => (issue.updated_at || '') > latest ? issue.updated_at : latest,'');
        groups.push({key,root,members,visible,active,column,updated});
      }
      return groups;
    }
    function renderProjects() {
      $('projects').innerHTML='<div class="eyebrow">Проекты · всего задач</div>' + [['all','Все проекты',state.issues.length],...state.projects.map(project => [project.slug,project.slug,project.issues.length])].map(([slug,name,count]) => `<button class="project ${state.project === slug ? 'active' : ''}" data-project="${escapeHtml(slug)}" title="${escapeHtml(name)} · ${count} задач" type="button"><span class="project-name">${escapeHtml(name)}</span><span class="project-count">${count}</span></button>`).join('');
      $('projects').querySelectorAll('[data-project]').forEach(button => button.addEventListener('click', () => {state.project=button.dataset.project;closeDrawer();render();}));
    }
    function taskCard(issue,nested=false) {
      const kind=nested ? '↳ Подзадача' : (typeNames[issue.issue_type] || 'Задача');
      return `<button class="task ${nested ? 'subtask' : 'standalone'} ${issue.status==='closed' ? 'is-closed' : ''}" data-key="${escapeHtml(issueKey(issue))}" type="button"><div class="task-line"><span class="type-badge ${issue.status==='closed' ? 'closed' : nested ? 'subtask' : ''}">${escapeHtml(kind)}</span><span>${escapeHtml(issue.id)}</span><span class="task-time">${dateTime(issue.updated_at)}</span></div><div class="task-title">${escapeHtml(issue.title)}</div><div class="issue-meta">${escapeHtml(statusNames[issue.status] || issue.status)}</div></button>`;
    }
    function epicCard(group) {
      const parent=group.root || group.visible[0], children=group.visible.filter(issue => issue.id !== rootId(issue.id)).sort((a,b) => (b.updated_at || '').localeCompare(a.updated_at || ''));
      const byDay=new Map();
      for (const child of children) {const day=localDay(child.updated_at);if (!byDay.has(day)) byDay.set(day,[]);byDay.get(day).push(child);}
      const nested=[...byDay.entries()].map(([day,items]) => `<div class="subday">${escapeHtml(dayLabel(day))}</div>${items.map(issue => taskCard(issue,true)).join('')}`).join('');
      const isEpic=group.root?.issue_type==='epic';
      const label=isEpic ? '◆ Эпик' : '▣ Родительская задача';
      const closed=group.members.length-group.active.length;
      return `<article class="epic ${isEpic ? 'is-epic' : 'is-parent'}"><button class="epic-head" data-key="${escapeHtml(issueKey(parent))}" type="button"><div class="epic-kicker"><span class="type-badge ${isEpic ? 'epic' : 'parent'}">${label}</span><span>${escapeHtml(rootId(parent.id))}</span><span class="parent-status">· ${escapeHtml(statusNames[parent.status] || parent.status)}</span></div><div class="epic-title">${escapeHtml(group.root?.title || rootId(parent.id))}</div></button>${nested ? `<div class="epic-tasks">${nested}</div>` : ''}<div class="epic-foot">${group.active.length} активных${closed ? ` · ${closed} закрытых` : ''}</div></article>`;
    }
    function renderColumn(column, groups) {
      const matched=groups.filter(group => group.column === column.key).sort((a,b) => b.updated.localeCompare(a.updated));
      const visible=matched.slice(0,state.columnLimits[column.key]), days=new Map();
      for (const group of visible) {const day=localDay(group.updated);if (!days.has(day)) days.set(day,[]);days.get(day).push(group);}
      const content=[...days.entries()].map(([day,items]) => `<section class="day"><div class="day-head">${escapeHtml(dayLabel(day))}</div>${items.map(group => group.members.length>1 || group.root?.issue_type === 'epic' || group.visible[0].id.includes('.') ? epicCard(group) : taskCard(group.visible[0])).join('')}</section>`).join('');
      return `<section class="column ${column.key}" data-column="${column.key}"><div class="column-head"><span class="status-dot"></span>${column.title}<span class="column-count">${matched.length}</span></div><div class="column-body">${content || '<div class="empty">Пока пусто</div>'}${matched.length>visible.length ? `<button class="more" data-more="${column.key}" type="button">Показать ещё ${Math.min(200,matched.length-visible.length)} · осталось ${matched.length-visible.length}</button>` : ''}</div></section>`;
    }
    function render() {
      const project=state.projects.find(item => item.slug === state.project), groups=boardGroups(), board=$('board');
      const scrollLeft=board.scrollLeft, columnScrolls=new Map([...board.querySelectorAll('[data-column]')].map(column => [column.dataset.column,column.querySelector('.column-body').scrollTop]));
      $('title').textContent=project ? project.slug : 'Все проекты';
      $('summary').textContent=project ? project.root : `${state.projects.length} проектов из ~/beads · задачи по дате последнего обновления`;
      renderProjects();
      board.innerHTML=columns.map(column => renderColumn(column,groups)).join('');
      board.scrollLeft=scrollLeft;
      board.querySelectorAll('[data-column]').forEach(column => {column.querySelector('.column-body').scrollTop=columnScrolls.get(column.dataset.column) || 0;});
      board.querySelectorAll('[data-key]').forEach(button => button.addEventListener('click', () => openDrawer(button.dataset.key)));
      board.querySelectorAll('[data-more]').forEach(button => button.addEventListener('click', () => {state.columnLimits[button.dataset.more]+=200;render();}));
    }
    function promptFor(kind,issue) {
      const task=`${issue.id} «${issue.title}»`, project=issue.project.slug;
      if (kind==='inspect') return `Разбери задачу Beads ${task} в проекте ${project}: проверь актуальные описание, критерии и зависимости, затем скажи следующий шаг.`;
      if (kind==='claim') return `Возьми в работу задачу Beads ${task} в проекте ${project} и приступай. Сначала проверь актуальное состояние и критерии готовности.`;
      if (kind==='continue') return `Продолжи работу по задаче Beads ${task} в проекте ${project}. Сначала проверь уже сделанное, затем выполни оставшуюся работу.`;
      return `Закрой задачу Beads ${task} в проекте ${project}. Перед закрытием проверь критерии готовности и зафиксируй результат.`;
    }
    function openDrawer(key) {
      const issue=state.byKey.get(key);if (!issue) return;
      state.selected=key;
      const field=(name,value) => value ? `<div class="field"><div class="field-label">${name}</div><div class="field-value">${escapeHtml(value)}</div></div>` : '';
      const warning=issue.project.source==='live' ? '' : `<div class="source-warning">${issue.project.source==='demo' ? 'Это демоданные. ' : issue.project.source==='snapshot' ? `Показан снимок от ${dateTime(issue.project.updated_at)}. ` : 'Данные проекта недоступны. '}${escapeHtml(issue.project.error || '')}</div>`;
      $('drawer').innerHTML=`<div class="drawer-top"><div class="drawer-id">${escapeHtml(issue.id)}</div><button class="close" id="close-drawer" type="button" aria-label="Закрыть подробности">×</button></div><h2>${escapeHtml(issue.title)}</h2><div class="chips"><span class="chip">${escapeHtml(statusNames[issue.status] || issue.status)}</span><span class="chip">P${escapeHtml(issue.priority)}</span><span class="chip ${issue.issue_type==='epic' ? 'type-epic' : ''}">${escapeHtml(typeNames[issue.issue_type] || issue.issue_type || 'Задача')}</span>${issue.assignee ? `<span class="chip">${escapeHtml(issue.assignee)}</span>` : ''}</div>${field('Описание',issue.description)}${field('Критерии готовности',issue.acceptance_criteria)}${field('Результат закрытия',issue.close_reason)}${field('Проект',issue.project.root)}<hr class="rule"><h3>Промпты</h3><p class="hint">Кнопка копирует текст в буфер. Beads здесь не меняется.</p><div class="actions"><button class="action primary" data-action="inspect" type="button">Разобрать</button>${issue.status==='closed' ? '' : `<button class="action" data-action="${issue.status==='open' ? 'claim' : 'continue'}" type="button">${issue.status==='open' ? 'Взять в работу' : 'Продолжить'}</button><button class="action" data-action="close" type="button">Закрыть</button>`}</div>${warning}`;
      $('close-drawer').addEventListener('click',closeDrawer);
      $('drawer').querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => copy(promptFor(button.dataset.action,issue))));
      $('backdrop').classList.add('show');$('drawer').classList.add('show');
    }
    function closeDrawer() {state.selected=null;$('backdrop').classList.remove('show');$('drawer').classList.remove('show');}
    function showToast(message) {const toast=$('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(() => toast.classList.remove('show'),2300);}
    async function copy(text) {
      try {
        let copied=false;
        if (navigator.clipboard && window.isSecureContext) {try {await navigator.clipboard.writeText(text);copied=true;} catch { /* Резервный способ для браузеров без доступа к Clipboard API. */ }}
        if (!copied) {const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();copied=document.execCommand('copy');area.remove();}
        showToast(copied ? 'Промпт скопирован' : 'Не удалось скопировать');
      } catch {showToast('Не удалось скопировать');}
    }
    function applyData(data) {
      state.projects=data.projects;
      state.issues=data.projects.flatMap(project => project.issues.map(issue => ({...issue,project})));
      state.byKey=new Map(state.issues.map(issue => [issueKey(issue),issue]));
      render();
      if (state.selected && state.byKey.has(state.selected)) openDrawer(state.selected);
      else if (state.selected) closeDrawer();
    }
    async function refresh() {
      if (state.loading) return;
      state.loading=true;$('refresh').disabled=true;$('sync').className='sync';$('sync').textContent='Обновляю…';
      try {
        const response=await fetch('/api/projects',{cache:'no-store'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data=await response.json();
        const snapshots=data.projects.filter(project => project.source==='snapshot').length, errors=data.projects.filter(project => project.source==='error').length;
        $('sync').textContent=errors ? `${errors} проектов недоступно · ${dateTime(data.fetched_at)}` : snapshots ? `${snapshots} из снимка · ${dateTime(data.fetched_at)}` : `Актуально · ${dateTime(data.fetched_at)}`;
        $('sync').className=errors ? 'sync error' : snapshots ? 'sync warning' : 'sync';
        applyData(data);
      } catch (error) {
        $('sync').className='sync error';$('sync').textContent=`Ошибка обновления: ${error.message}`;
        if (!state.projects.length) $('board').innerHTML='<div class="empty">Не удалось получить задачи. Запусти <code>python3 server.py</code> и открой адрес, который он покажет.</div>';
      } finally {state.loading=false;$('refresh').disabled=false;}
    }
    $('refresh').addEventListener('click',refresh);
    $('search').addEventListener('input',render);
    $('backdrop').addEventListener('click',closeDrawer);
    document.addEventListener('keydown',event => {if (event.key==='Escape') closeDrawer();});
    if (location.protocol==='file:') {
      try {
        const snapshot=JSON.parse($('snapshot-data').textContent);
        applyData(snapshot);
        $('sync').className='sync warning';
        $('sync').textContent=`Демоданные · живые задачи через start.command`;
        $('refresh').disabled=true;
        $('refresh').title='Для обновления запусти start.command';
      } catch {
        $('sync').className='sync error';
        $('sync').textContent='Демоданные недоступны · запусти start.command';
        $('board').innerHTML='<div class="empty">Для живых данных запусти <code>start.command</code>.</div>';
      }
    } else {
      refresh();
      setInterval(() => {if (document.visibilityState==='visible') refresh();},30000);
    }
  </script>
</body>
</html>
